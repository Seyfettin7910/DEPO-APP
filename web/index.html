<!DOCTYPE html>
<html lang="tr">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- maximum-scale: iPhone, yazı alanına dokununca sayfayı kendiliğinden büyütmesin -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="description" content="Depo ve araç stok takibi (seri numarası ile)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Depo Yönetim">
  <meta name="theme-color" content="#2E6F40">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">
  <title>DEPO YÖNETİM SİSTEMİ</title>
  <style>
    body { margin: 0; background: #f6f8f6; font-family: sans-serif; }
    #yukleniyor { position: fixed; inset: 0; display: flex; align-items: center;
      justify-content: center; color: #2E6F40; font-size: 18px; }
  </style>
</head>
<body>
  <div id="yukleniyor">DEPO YÖNETİM SİSTEMİ yükleniyor…</div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('yukleniyor');
      if (el) el.remove();
      // Flutter viewport'u büyütmeye izin verecek şekilde değiştiriyor;
      // iPhone yazı alanına dokununca sayfayı kendiliğinden büyütmesin.
      var vp = document.querySelector('meta[name=viewport]');
      if (vp) vp.setAttribute('content',
        'width=device-width, initial-scale=1.0, maximum-scale=1.0');
    });
  </script>
  <script src="push.js"></script>
  <script src="tarayici.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
