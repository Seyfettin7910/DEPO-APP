# Bildirim gönderici sunucu fonksiyonunu (supabase/functions/bildirim-gonder)
# Supabase'e yayınlar. Bir kez gerekli secret:
#   SUPABASE_ACCESS_TOKEN  Supabase > Account > Access Tokens > Generate new token
name: Supabase fonksiyonunu yayınla

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/supabase.yml'
  workflow_dispatch:

jobs:
  yayinla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Fonksiyonu yayınla
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret'ı eklenmemiş (Supabase > Account > Access Tokens)"
            exit 1
          fi
          supabase functions deploy bildirim-gonder --project-ref xxnzfqtwtfzltjkjteco --no-verify-jwt
