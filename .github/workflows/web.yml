# GitHub'a her yüklemede (main dalı) web sürümünü derleyip GitHub Pages'te
# yayınlar. Bir kez: Repo > Settings > Pages > Source = "GitHub Actions".
# Adres: https://<kullanici-adi>.github.io/<repo-adi>/
name: Web derle ve yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # Eksik web dosyalarını (ikonlar vb.) tamamlar, var olanlara dokunmaz.
      - run: flutter create --platforms=web .
      - run: flutter pub get
      # Tarayıcı veritabanı için sqlite3.wasm ve sqflite_sw.js üretir.
      - run: dart run sqflite_common_ffi_web:setup --force
      - name: Sürüm numarası
        id: surum
        run: echo "v=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)" >> "$GITHUB_OUTPUT"
      - run: flutter build web --release --base-href "/${{ github.event.repository.name }}/" --dart-define=APP_SURUM=${{ steps.surum.outputs.v }}
      # Uygulama bu dosyaya bakıp "yeni sürüm var" der.
      - run: echo '{"surum":"${{ steps.surum.outputs.v }}"}' > build/web/version.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  yayinla:
    needs: derle
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
