# Her yüklemede (main dalı) imzalı Android APK derler ve GitHub "Releases"
# bölümüne koyar. Sabit indirme adresi:
# https://github.com/Seyfettin7910/DEPO-APP/releases/latest/download/Depo-Yonetim-Sistemi.apk
# (1.30.4'ten önceki sürümler güncellemeyi eski adlarla arar: Depo-Otomasyon-Sistemi.apk, depo-takip.apk)
# (Eski uygulamalar güncelleme için depo-takip.apk adını arar; o da yüklenir.)
#
# Gerekli secret'lar (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64   imza anahtarının base64 hali
#   ANDROID_KEYSTORE_PASSWORD imza anahtarının şifresi
name: Android APK derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: İmza anahtarını hazırla
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret'ı eklenmemiş"
            exit 1
          fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/depo.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/depo.jks" >> "$GITHUB_ENV"

      - name: Android Gradle dosyalarını güncel şablona uyarla
        run: |
          flutter create --org com.example --project-name depo_app --platforms android "$RUNNER_TEMP/sablon"
          python3 tool/android_hazirla.py "$RUNNER_TEMP/sablon"

      - name: Sürüm numarası
        id: surum
        run: echo "v=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)" >> "$GITHUB_OUTPUT"

      - run: flutter pub get

      - name: APK derle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: depo
        run: flutter build apk --release --dart-define=APP_SURUM=${{ steps.surum.outputs.v }}

      - run: |
          cp build/app/outputs/flutter-apk/app-release.apk Depo-Yonetim-Sistemi.apk
          cp build/app/outputs/flutter-apk/app-release.apk Depo-Otomasyon-Sistemi.apk
          cp build/app/outputs/flutter-apk/app-release.apk depo-takip.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.surum.outputs.v }}
          name: DEPO YÖNETİM SİSTEMİ ${{ steps.surum.outputs.v }}
          files: |
            Depo-Yonetim-Sistemi.apk
            Depo-Otomasyon-Sistemi.apk
            depo-takip.apk
          make_latest: true
