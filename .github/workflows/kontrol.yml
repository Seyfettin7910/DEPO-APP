# main dışındaki dallarda: yayınlamadan önce kodun derlendiğini denetler
# (flutter analyze + web derlemesi). Hiçbir şey yayınlanmaz.
name: Kod kontrolü

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  kontrol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=web .
      - run: flutter pub get
      - name: Analiz (yalnızca hatalar durdurur)
        run: |
          set +e
          flutter analyze lib --no-fatal-infos --no-fatal-warnings > analiz.txt 2>&1
          durum=$?
          cat analiz.txt
          # Hataları tek bir uyarı notu olarak da yaz (Actions özetinde görünür)
          hatalar=$(grep -E "^\s*error " analiz.txt | head -60 | sed ':a;N;$!ba;s/\n/%0A/g')
          if [ -n "$hatalar" ]; then echo "::error title=Analiz hataları::$hatalar"; fi
          uyarilar=$(grep -E "^\s*warning " analiz.txt | head -60 | sed ':a;N;$!ba;s/\n/%0A/g')
          if [ -n "$uyarilar" ]; then echo "::warning title=Analiz uyarıları::$uyarilar"; fi
          exit $durum
      - name: Testler (Okut kuralları vb.)
        run: flutter test test/okut_listesi_test.dart test/bolge_adi_test.dart test/sn_metni_test.dart test/urun_adi_test.dart test/kurum_barkodu_test.dart test/xlsx_yazici_test.dart
      # Ubuntu 26 görüntüsünde sistem Python'una pip ile kurulamıyor
      # (externally-managed); ayrı Python (Excel denetimi ve duman testi).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Excel çıktısını bağımsız okuyucuyla denetle (openpyxl)
        run: |
          pip install --quiet openpyxl==3.1.5
          python3 tool/xlsx_denetim.py
      - name: Örnek Excel raporu (elle kontrol için)
        uses: actions/upload-artifact@v4
        with:
          name: ornek-rapor-xlsx
          path: build/ornek_rapor.xlsx
          retention-days: 7
      - run: flutter build web --release
      - name: Web duman testi (giriş ekranı, tarayıcı tanıma)
        run: |
          cat /etc/os-release | grep PRETTY_NAME
          pip install --quiet playwright==1.47.0 || { echo "::error title=Duman testi::pip install playwright başarısız"; exit 1; }
          python -m playwright install --with-deps chromium > pw_kurulum.txt 2>&1 || { echo "::error title=Duman testi::playwright kurulumu başarısız: $(tail -c 600 pw_kurulum.txt | tr '\n' ' ')"; exit 1; }
          python3 tool/web_duman_testi.py 2> duman_hata.txt || { echo "::error title=Duman testi::betik hata verdi: $(tail -c 800 duman_hata.txt | tr '\n' ' ')"; exit 1; }

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: İmza anahtarı
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/depo.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/depo.jks" >> "$GITHUB_ENV"
      - name: Gradle dosyaları
        run: |
          flutter create --org com.example --project-name depo_app --platforms android "$RUNNER_TEMP/sablon"
          python3 tool/android_hazirla.py "$RUNNER_TEMP/sablon"
      - run: flutter pub get
      - name: APK derle (yayınlanmaz)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: depo
        run: |
          set +e
          flutter build apk --release > derleme.txt 2>&1
          durum=$?
          cat derleme.txt
          if [ $durum -ne 0 ]; then
            hatalar=$(grep -E "(^e: |error:|Error:|What went wrong|FAILURE|Could not|> )" derleme.txt | head -40 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Android derleme hatası::$hatalar"
          fi
          exit $durum
