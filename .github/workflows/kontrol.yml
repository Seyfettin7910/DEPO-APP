# main dışındaki dallarda: yayınlamadan önce kodun derlendiğini denetler
# (flutter analyze + web derlemesi). Hiçbir şey yayınlanmaz.
name: Kod kontrolü

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  kontrol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=web .
      - run: flutter pub get
      - name: Analiz (yalnızca hatalar durdurur)
        run: |
          set +e
          flutter analyze lib --no-fatal-infos --no-fatal-warnings > analiz.txt 2>&1
          durum=$?
          cat analiz.txt
          # Hataları tek bir uyarı notu olarak da yaz (Actions özetinde görünür)
          hatalar=$(grep -E "^\s*error " analiz.txt | head -60 | sed ':a;N;$!ba;s/\n/%0A/g')
          if [ -n "$hatalar" ]; then echo "::error title=Analiz hataları::$hatalar"; fi
          uyarilar=$(grep -E "^\s*warning " analiz.txt | head -60 | sed ':a;N;$!ba;s/\n/%0A/g')
          if [ -n "$uyarilar" ]; then echo "::warning title=Analiz uyarıları::$uyarilar"; fi
          exit $durum
      - run: flutter build web --release
