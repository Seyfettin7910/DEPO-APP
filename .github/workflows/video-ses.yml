name: Video seslendirme (geçici)
on:
  push:
    branches: [video-ses]
permissions:
  contents: write
jobs:
  ses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install edge-tts
      - run: python tool/video_ses.py
      - name: Sesleri dala yaz
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add out
          git commit -m "Seslendirme dosyaları"
          git push
