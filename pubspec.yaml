name: depo_app
description: Çok kullanıcılı, çoklu depo stok ve kullanım takip uygulaması (iOS / Android / Windows / Web)
publish_to: 'none'
version: 1.26.0+51

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Yerel veritabanı (offline-first) - kod üretimi (build_runner) GEREKTİRMEZ,
  # bu yüzden FlutLab gibi bulut IDE'lerde de sorunsuz derlenir.
  sqflite: ^2.3.3+1
  # Windows/Linux masaüstünde sqflite için FFI arka ucu gerekir
  # (main.dart içinde platforma göre etkinleştirilir).
  sqflite_common_ffi: ^2.3.3
  # Web (tarayıcı) için sqlite: veriler IndexedDB'de saklanır.
  sqflite_common_ffi_web: '>=0.4.0 <2.0.0'
  path: ^1.9.0
  path_provider: ^2.1.3
  # Son giriş e-postasını hatırlamak için
  shared_preferences: ^2.2.0

  # Merkezi backend + senkronizasyon
  supabase_flutter: ^2.5.6

  # Barkod / QR okuma
  mobile_scanner: ^7.4.2
  # Bildirimler (Android) ve uygulama kapalıyken arka plan kontrolü
  flutter_local_notifications: ^19.4.0
  workmanager: ^0.10.0

  # Uyarı / onay sesleri (barkod okuma)
  audioplayers: ^6.0.0

  # Yardımcılar
  uuid: ^4.4.0
  intl: ^0.19.0
  connectivity_plus: ^6.0.3

  # Raporlama
  pdf: ^3.11.0
  printing: ^5.13.1
  # Excel (.xlsx) rapor çıktısı ve telefonda paylaşma
  excel: '>=4.0.2 <5.0.0'
  share_plus: '>=7.2.0 <11.0.0'
  # Güncelleme kontrolü ve indirme linkini açma
  http: '>=0.13.5 <2.0.0'
  url_launcher: '>=6.1.0 <7.0.0'
  # Sahada kullanım anındaki GPS konumu
  geolocator: '>=13.0.0 <15.0.0'
  fl_chart: ^0.68.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/fonts/
    - assets/logo.png
